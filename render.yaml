databases:
  - name: gantt-pg
    plan: free
    databaseName: gantt
    user: gantt

services:
  - type: web
    name: gantt-ai-backend
    runtime: docker
    plan: free
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gantt-pg
          property: connectionString
      - key: CORS_ORIGIN
        sync: false
      - key: LLM_PROVIDER
        value: mock
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: YANDEX_API_KEY
        sync: false
      - key: YANDEX_FOLDER_ID
        sync: false
      - key: YANDEX_MODEL_URI
        sync: false
      - key: GIGACHAT_CLIENT_ID
        sync: false
      - key: GIGACHAT_CLIENT_SECRET
        sync: false
      - key: MAX_CHAT_TURNS_PER_SESSION
        value: "50"
